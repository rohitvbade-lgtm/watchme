<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="200" height="300">
  <style>
    .bg { fill: #1a1a2e; }
    .box { fill: #16213e; }
    .accent { fill: #e94560; }
    .txt { fill: #94a3b8; }
    @media (prefers-color-scheme: light) {
      .bg { fill: #f1f5f9; }
