<ion-card>
  <img [src]="posterUrl || 'assets/placeholder.svg'" onerror="this.src='assets/placeholder.svg'" />
  <ion-card-header>
    <ion-card-subtitle class="d-flex align-items-center gap-1">
      <span class="badge bg-primary text-uppercase">
        <i class="bi bi-film me-1" *ngIf="mediaType === 'movie'"></i>
        <i class="bi bi-tv me-1" *ngIf="mediaType === 'tv'"></i>
        {{ mediaType }}
      </span>
      <span *ngIf="year" class="text-muted small ms-1">
        <i class="bi bi-calendar3 me-1"></i>{{ year }}
      </span>
    </ion-card-subtitle>
    <ion-card-title>{{ title }}</ion-card-title>
  </ion-card-header>
  <ion-card-content *ngIf="overview">
    {{ overview }}
  </ion-card-content>
</ion-card>
